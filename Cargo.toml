[package]
name = "worktree-keeper"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Keeps agent git worktrees safe to create, inspect and remove"
publish = false

[[bin]]
name = "worktree"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A discarded Result is how "could not check" would turn into success.
let_underscore_must_use = "deny"
